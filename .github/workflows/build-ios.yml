name: Build iOS App (FitStats)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build FitStats iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Build Vite Production Bundle
        run: npm run build

      - name: 5. Initialize Capacitor iOS Platform
        run: |
          npx cap add ios

      - name: 6. Inject HealthKit Entitlements & Permissions
        run: |
          # 1) Info.plist에 애플 건강 접근 사유 등록
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 'FitStats에서 사용자의 걸음 수, 칼로리, 심박수 및 운동 통계를 분석하고 시각화하기 위해 읽기 권한이 필요합니다.'" "$PLIST_PATH" || true
            /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string 'FitStats 건강 데이터 연동'" "$PLIST_PATH" || true
          fi

          # 2) App.entitlements에 HealthKit 권한 활성화
          ENTITLEMENTS_PATH="ios/App/App/App.entitlements"
          cat << 'EOF' > "$ENTITLEMENTS_PATH"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
            <key>com.apple.developer.healthkit.access</key>
            <array/>
          </dict>
          </plist>
          EOF

      - name: 7. Sync Web Assets to iOS
        run: npx cap sync ios

      - name: 8. Build iOS App Archive via xcodebuild
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: 9. Package into Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App bundle at $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r FitStats-unsigned.ipa Payload
          else
            echo "Error: .app bundle not found in DerivedData"
            find build -maxdepth 4 || true
            exit 1
          fi

      - name: 10. Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitStats-iOS-App
          path: build/FitStats-unsigned.ipa
          retention-days: 14